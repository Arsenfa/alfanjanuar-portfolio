<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative blurred shapes -->
  <circle cx="850" cy="180" r="180" fill="#6366F1" opacity="0.25" filter="url(#blur1)"/>
  <circle cx="1050" cy="450" r="140" fill="#3B82F6" opacity="0.2" filter="url(#blur2)"/>
  <rect x="700" y="350" width="200" height="200" rx="40" fill="#10B981" opacity="0.15" filter="url(#blur3)"/>
  <circle cx="950" cy="300" r="60" fill="#8B5CF6" opacity="0.3" filter="url(#blur2)"/>

  <!-- Accent line -->
  <rect x="80" y="340" width="64" height="4" rx="2" fill="#64748B" opacity="0.6"/>

  <!-- Name -->
  <text x="80" y="280" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="72" fill="white" letter-spacing="-2">Alfan Januar</text>

  <!-- Subtitle -->
  <text x="80" y="390" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="28" fill="#94A3B8" letter-spacing="-0.5">Frontend &amp; Mobile Developer</text>

  <!-- Description -->
  <text x="80" y="450" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="20" fill="#64748B">Clean, performant, and user-friendly interfaces</text>
  <text x="80" y="480" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="20" fill="#64748B">for web and mobile.</text>

  <!-- Domain -->
  <text x="80" y="560" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="18" fill="#475569" letter-spacing="2">ALFANJANUAR.DEV</text>

  <!-- AJ monogram -->
  <rect x="1060" y="530" width="72" height="72" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="1096" y="575" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="28" fill="white" text-anchor="middle">AJ</text>
</svg>
